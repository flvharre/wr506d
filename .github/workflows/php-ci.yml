name: Symfony + PHP - WR506D

on:
    push:
        branches: [ "develop","main" ]
    pull_request:
        branches: [ "develop","main" ]

permissions:
    contents: read

jobs:
    symfony-tests:
        runs-on: ubuntu-latest
        steps:
            - uses: shivammathur/setup-php@2cb9b829437ee246e9b3cac53555a39208ca6d28
              with:
                  php-version: '8.3'
            - uses: actions/checkout@v3
            - name: Copy .env.test.local
              run: php -r "file_exists('.env.test.local') || copy('.env.test', '.env.test.local');"
            - name: Create .env from .env.test if not present
              run: php -r "file_exists('.env') || copy('.env.test', '.env');"
            - name: Cache Composer packages
              id: composer-cache
              uses: actions/cache@v3
              with:
                  path: vendor
                  key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-
            - name: Install Dependencies
              run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
            - name: Create Database
              run: |
                  mkdir -p data
                  touch data/database.sqlite
            - name: Execute tests (Unit and Feature tests) via PHPUnit
              env:
                  DATABASE_URL: sqlite:///%kernel.project_dir%/data/database.sqlite
                  CORS_ALLOW_ORIGIN: '*'
              run: vendor/bin/phpunit
            - name: Run PHP_CodeSniffer
              run: vendor/bin/phpcs --standard=PSR2 src/
            - name: Run PHPStan
              run: vendor/bin/phpstan analyze src/
            - name: Run PHPMD
              run: vendor/bin/phpmd src/ text cleancode,codesize,controversial,design
